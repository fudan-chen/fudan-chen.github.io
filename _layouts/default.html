<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (_) {}
  </script>
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  {% if page.math %}
  <script>window.MathJax = {tex: {inlineMath: [['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']]}, options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}};</script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav aria-label="主导航">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
        <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog/' %}aria-current="page"{% endif %}>文章</a>
        <a href="{{ '/archive/' | relative_url }}" {% if page.url == '/archive/' %}aria-current="page"{% endif %}>归档</a>
        <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>关于</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="切换深浅色主题" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3v18a9 9 0 0 0 0-18Z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>
  <main id="main" class="container" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <div class="footer-inner">
      <span>© {{ site.time | date: '%Y' }} {{ site.author | escape }}</span>
      <span><a href="{{ '/feed.xml' | relative_url }}">RSS</a><span class="separator">·</span><a href="{{ site.github_url }}">GitHub</a><span class="separator">·</span>Jekyll &amp; GitHub Pages</span>
    </div>
  </footer>
</body>
</html>
